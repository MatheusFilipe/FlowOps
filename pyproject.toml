[project]
name = "flowops"
version = "0.1.0"
description = ""
authors = [
    {name = "Matheus Filipe Rodrigues",email = "matheus.filipes.rodrigues@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "fastapi[standard] (>=0.138.0,<0.139.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-extra-types[phone] (>=2.11.1,<3.0.0)",
    "phonenumbers (>=9.0.33,<10.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
    "typos (>=1.46.3,<2.0.0)",
    "httpx2 (>=2.4.0,<3.0.0)",
    "freezegun (>=1.5.5,<2.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.typos.default.extend-words]
selectin = "selectin"
cliente = "cliente"

[tool.pytest.ini_options]
pythonpath = ['.']
addopts = ['-p', 'no:warnings']
asyncio_default_fixture_loop_scope = 'function'

[tool.typos.files]
extend-exclude = ["*.md", "migrations"]

[tool.taskipy.tasks]
pre_lint = 'typos'
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev flowops/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=flowops -vv'
post_test = 'coverage html'